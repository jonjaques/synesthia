name: Healthcheck

# The PR quality gate. Two independent jobs, because the repo is two projects:
# `web/` is a self-contained Astro site with its own package.json and lockfile,
# and everything else is the macOS app, gated by `make healthcheck`.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: healthcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Who is allowed to merge this. Runs first and takes seconds, so the answer is
  # on the PR long before the 45-minute Apple job finishes.
  #
  # This job does NOT fail a high-risk PR — that would make the protected paths
  # unmergeable by anyone, including you. It labels, and the label plus the job
  # summary are what a reviewer sees. The actual enforcement is that the
  # `/queue` loop runs scripts/risk-check.sh itself before merging, against the
  # same .github/risk-paths.txt; it never reads this label back, because a label
  # is something the loop has permission to change.
  risk-gate:
    name: Risk gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The merge base has to exist locally for `git diff base...HEAD`, so this
      # needs real history — fetch-depth: 0 rather than the default shallow
      # clone, which would make every file look changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: risk
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          # stderr to a file and then echoed, rather than `2> >(tee …)`: process
          # substitution is asynchronous, so the summary can be written before
          # the tee has flushed and the reasoning comes out empty at random.
          # `|| STATUS=$?` rather than letting `set -e` abort: on a failure the
          # script's own diagnosis is sitting in /tmp/why, and aborting here
          # would throw it away and leave a step that failed with no output.
          # That happened — a GNU/BSD `mktemp` difference, invisible in the log.
          STATUS=0
          RESULT=$(./scripts/risk-check.sh --base "$BASE" 2>/tmp/why) || STATUS=$?
          cat /tmp/why >&2
          if [[ $STATUS -ne 0 ]]; then
            echo "::error::risk-check.sh exited $STATUS — the gate could not classify this PR."
            exit $STATUS
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          {
            echo "## Risk gate: \`$RESULT\`"
            echo
            echo '```'
            cat /tmp/why
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --add-label is idempotent, and the low branch deliberately does NOT
      # remove risk:high: a human may have applied it on purpose, and a job that
      # silently downgraded that would be the one bug here that matters.
      - name: Label the pull request
        if: steps.risk.outputs.result == 'high'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.number }}" --add-label "risk:high"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Treat web/ as its own project: every step runs from there.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting and Astro types
        run: npm run check

      - name: Type-check the Pages Functions
        run: npm run typecheck

      - name: Build
        run: npm run build

  apple:
    name: Apple
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The project needs Xcode 26.6+ (builds against the macOS 26 SDK, Swift 6.3,
      # swift-format from the toolchain) and the macos-26 image still defaults
      # /Applications/Xcode.app to 26.5 — so pick the newest Xcode 26 it ships,
      # and fall back to whatever is selected if the layout ever changes.
      - name: Select Xcode
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [[ -n "$app" ]]; then sudo xcode-select -s "$app"; fi
          xcodebuild -version
          swift --version

      # Shaders.metal compiles at build time, which needs the Metal Toolchain
      # component. It is a no-op when the image already has it; drop this step
      # if the runner images start shipping it unconditionally.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain -quiet || true

      # Sparkle is the only SPM dependency, and only the Direct target links it.
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Synesthia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # CI=true is set by Actions, which makes the Makefile ad-hoc sign instead
      # of reaching for a Developer ID that does not exist on the runner.
      - name: Healthcheck
        run: make install && make healthcheck
